<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --mood-color-main: #b4b498; --mood-color-grad: #78716c; }
        body { background-color: #0d0d0d; color: #f0f0f0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, system-ui; overflow: hidden; }
        .serif { font-family: 'Noto Serif SC', serif; }
        .glow-bg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100vw; height: 100vw; background: radial-gradient(circle, var(--mood-color-main) 0%, transparent 70%); filter: blur(120px); opacity: 0.15; z-index: -1; transition: all 2.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-container { width: 170px; height: 215px; position: relative; border: 1.5px solid rgba(255,255,255,0.1); border-bottom-left-radius: 75px; border-bottom-right-radius: 75px; overflow: hidden; background: rgba(255,255,255,0.02); }
        .liquid-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; height: 45%; transition: height 2s cubic-bezier(0.4, 0, 0.2, 1); }
        .waves { position: absolute; top: -38px; left: 0; width: 100%; height: 40px; }
        .parallax > use { animation: move-forever 5s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; fill: var(--mood-color-main); opacity: 0.4; transition: fill 2s ease; }
        .parallax > use:nth-child(2) { animation-delay: 0s; animation-duration: 4s; fill: var(--mood-color-main); opacity: 1; transition: fill 2s ease; }
        @keyframes move-forever { 0% { transform: translate3d(-90px,0,0); } 100% { transform: translate3d(85px,0,0); } }
        .liquid-body { width: 100%; height: 100%; position: relative; background: var(--mood-color-main); transition: background 2s ease; }
        #result-view .liquid-body { background: linear-gradient(to bottom, var(--mood-color-main), var(--mood-color-grad)); }
        .bubbles { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
        .bubble { position: absolute; bottom: -10px; background: rgba(255,255,255,0.3); border-radius: 50%; animation: rise 4s infinite ease-in; }
        @keyframes rise { 0% { bottom: -10px; transform: translateX(0); opacity: 0; } 20% { opacity: 0.8; } 100% { bottom: 85%; transform: translateX(12px); opacity: 0; } }
        .b1 { left: 15%; width: 4px; height: 4px; animation-duration: 3s; }
        .b2 { left: 40%; width: 6px; height: 6px; animation-duration: 4.5s; animation-delay: 0.5s; }
        .b3 { left: 70%; width: 3px; height: 3px; animation-duration: 3.5s; animation-delay: 1s; }
        .card-inner { position: relative; overflow: hidden; background: #121212; backdrop-filter: blur(40px); border: 0.5px solid rgba(255,255,255,0.08); border-radius: 40px; padding: 35px 28px; width: 100%; max-width: 360px; box-shadow: 0 40px 100px rgba(0,0,0,0.7); text-align: center; z-index: 1; }
        .card-inner::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at top left, var(--mood-color-main), transparent 60%); opacity: 0.12; z-index: -1; transition: all 1s ease; }
        textarea { resize: none; border: 0.5px solid rgba(255,255,255,0.1) !important; }
        .fade-out { opacity: 0; transition: opacity 0.8s ease; }
    </style>
</head>

            document.documentElement.style.setProperty('--mood-color-main', p.s);

        }

        function mixMood() {
            const input = document.getElementById('mood-input').value;
            if(!input) return alert("请告诉我你的心情...");

            // 1. 基础情绪分计算 (不含关键词)
            let scoredMenu = BAR_MENU.map(drink => {
                let score = 0;
                // 分类匹配分
                SEMANTIC_ENGINE.CATEGORIES[drink.category].forEach(k => {
                    if (input.includes(k)) score += 3.0;
                });
                // 语气修正
                SEMANTIC_ENGINE.INTENSITY_MODIFIERS.forEach(m => {
                    if (input.includes(m)) score *= 1.2;
                });
                // 增加显著随机性 (范围 0-5.0)，确保 Next Choice 每次不同
                score += Math.random() * 5.0; 
                return { ...drink, score };
            });

            // 2. 查找是否有精准匹配的关键词酒款
            let winnerIndex = -1;
            for (let i = 0; i < BAR_MENU.length; i++) {
                if (BAR_MENU[i].keywords && BAR_MENU[i].keywords.some(k => input.includes(k))) {
                    winnerIndex = i;
                    break; // 只要找到第一个符合关键词的，就锁定它
                }
            }

            // 3. 构建结果序列
            if (winnerIndex !== -1) {
                // 如果命中了关键词，提取该酒款并置于首位
                const winner = scoredMenu.splice(winnerIndex, 1)[0];
                // 剩下的酒款按随机分排序
                scoredMenu.sort((a, b) => b.score - a.score);
                sortedMatches = [winner, ...scoredMenu];
            } else {
                // 如果没有命中关键词，直接按随机情绪分排序
                sortedMatches = scoredMenu.sort((a, b) => b.score - a.score);
            }

            // 4. 执行动效与转场
            currentIndex = 0;
            const target = sortedMatches[currentIndex];
            setUIColors(target.colors);
            document.getElementById('main-liquid').style.height = '92%';
            document.getElementById('home-controls').classList.add('fade-out');
            document.querySelector('#home-view header').classList.add('fade-out');

            setTimeout(() => {
                document.getElementById('home-view').classList.add('hidden');
                document.getElementById('result-view').classList.remove('hidden');
                updateResultCard(target);
            }, 2200);
        }

        function updateResultCard(d) {
            document.getElementById('res-cn-name').innerText = d.cn_name;
            document.getElementById('res-en-name').innerText = d.en_name;
            document.getElementById('res-flavor-tag').innerText = `- ${d.flavor_tag} -`;
            document.getElementById('res-base').innerText = d.base;
            document.getElementById('res-top').innerText = d.top;
            document.getElementById('res-mid').innerText = d.mid;
            document.getElementById('res-bnote').innerText = d.bnote;
            document.getElementById('res-perc').innerText = d.intensity;
            document.getElementById('res-fill').style.width = d.intensity;
            document.getElementById('res-fill').style.backgroundColor = d.colors.s;
            document.getElementById('res-quote').innerText = d.quote;
            setUIColors(d.colors);
        }

        function nextRecommendation() {
            currentIndex = (currentIndex + 1) % 3;
            const card = document.getElementById('result-card');
            card.style.opacity = 0;
            setTimeout(() => {
                updateResultCard(sortedMatches[currentIndex]);
                card.style.opacity = 1;
                card.classList.add('animate-in', 'fade-in', 'duration-700');
            }, 400);
        }
    </script>
</body>
</html>
